<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reference Graph</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; /* Modern font stack */
      margin: 0;
      padding: 20px;
      background-color: #f0f2f5; /* Softer background */
    }
    
    .container {
      max-width: 1400px; /* Slightly wider container */
      margin: 0 auto;
      background-color: white;
      border-radius: 12px; /* More rounded corners */
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); /* Softer, more pronounced shadow */
      padding: 30px; /* Increased padding */
    }
    
    h1 {
      color: #1f2937; /* Darker, modern heading color */
      margin-top: 0;
      font-size: 2.25rem; /* Larger heading */
      font-weight: 700;
    }
    
    .controls {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 15px; /* Increased gap */
    }
    
    input, button {
      padding: 10px 15px; /* Larger input/button padding */
      border-radius: 8px; /* More rounded */
      font-size: 0.95rem;
    }
    
    input {
      border: 1px solid #d1d5db; /* Lighter border */
      width: 70px;
    }
    
    button {
      background-color: #3b82f6; /* Tailwind's blue-500 */
      color: white;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease; /* Smoother transitions */
    }
    
    button:hover {
      background-color: #2563eb; /* Darker blue on hover */
      transform: translateY(-1px); /* Slight lift on hover */
    }
    
    svg {
      background-color: #ffffff; /* White background for SVG */
      border-radius: 12px; /* Rounded corners for SVG */
      border: 1px solid #e5e7eb; /* Lighter border for SVG */
      display: block; /* Ensure it behaves as a block element */
      width: 100%; /* Make SVG responsive */
      height: auto; /* Maintain aspect ratio */
      min-height: 600px; /* Minimum height for visualization */
    }

    .node {
      stroke: #ffffff; /* White stroke for nodes */
      stroke-width: 2px;
      transition: r 0.3s ease, fill 0.3s ease, stroke 0.3s ease; /* Smoother transitions */
    }
    
    .node:hover {
      stroke: #111827; /* Darker stroke on hover */
      cursor: pointer;
    }
    
    .root-node {
      fill: #ef4444; /* Red-500 */
    }
    
    .node-level-1 {
      fill: #3b82f6; /* Blue-500 */
    }
    
    .node-level-2 {
      fill: #10b981; /* Emerald-500 */
    }
    
    .node-level-3 {
      fill: #f59e0b; /* Amber-500 */
    }
    
    .node-level-4 {
      fill: #8b5cf6; /* Violet-500 */
    }
    
    .node-level-5 {
      fill: #06b6d4; /* Cyan-500 */
    }
    
    .link {
      stroke: #9ca3af; /* Gray-400 */
      stroke-opacity: 0.7;
      stroke-width: 1.5px;
      transition: stroke-width 0.3s ease, stroke-opacity 0.3s ease;
    }
    
    .link:hover {
      stroke-width: 2.5px;
      stroke-opacity: 1;
    }
    
    .label {
      font-size: 0.875rem; /* Tailwind's text-sm */
      fill: #374151; /* Darker gray for labels */
      pointer-events: none;
      user-select: none;
      transition: opacity 0.3s ease;
    }
    
    .tooltip {
      position: absolute;
      padding: 12px 16px; /* Increased padding */
      background-color: rgba(31, 41, 55, 0.9); /* Dark background */
      color: white;
      border-radius: 8px; /* More rounded */
      font-size: 0.875rem; /* text-sm */
      max-width: 350px; /* Wider tooltip */
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2); /* Softer shadow */
    }
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(240, 242, 245, 0.95); /* Slightly transparent background */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(5px); /* Apply blur effect */
    }
    
    .spinner {
      width: 60px; /* Larger spinner */
      height: 60px;
      border: 6px solid #e5e7eb; /* Lighter border */
      border-top: 6px solid #3b82f6; /* Blue spinner */
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 24px; /* Increased margin */
    }
    
    .progress-container {
      width: 350px; /* Wider progress bar container */
      margin-top: 24px;
    }
    
    .progress-bar {
      width: 100%;
      background-color: #e5e7eb; /* Lighter background */
      border-radius: 4px;
      overflow: hidden;
      height: 12px; /* Thicker progress bar */
    }
    
    .progress {
      height: 100%;
      background-color: #3b82f6; /* Blue progress */
      width: 0%;
      transition: width 0.4s ease; /* Smoother progress transition */
    }
    
    .progress-text {
      text-align: center;
      margin-top: 8px; /* More space */
      font-size: 0.95rem; /* text-sm */
      color: #4b5563; /* Slightly darker text */
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .save-button {
            position: fixed;
            top: 20px; /* Adjusted position */
            right: 20px; /* Adjusted position */
            padding: 12px 24px; /* Larger padding */
            background-color: #3b82f6; /* Tailwind blue */
            color: white;
            border: none;
            border-radius: 8px; /* More rounded */
            cursor: pointer;
            font-weight: 600; /* Semibold */
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 2px 5px rgba(59, 130, 246, 0.5); /* Subtle shadow */
        }
        .save-button:hover {
            background-color: #2563eb; /* Darker blue */
            transform: translateY(-2px); /* Slight lift */
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.7); /* More pronounced shadow */
        }
        .save-confirmation, .copy-confirmation {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(34, 197, 94, 0.9); /* Green for success */
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 0.3s ease;
            font-weight: 500;
        }
  </style>
</head>
<body>
  <div class="container">
    <a href="{% url 'search' %}"><h1>Go back to Home</h1></a>
    <button class="save-button" id="saveHistoryBtn">Save History</button>
    <div hidden id="search-id">{{search_id}}</div>
    <div id="tooltip" class="tooltip"></div>
    <svg id="reference-graph-svg">
      <!-- Graph will be rendered here by D3 -->
    </svg>
  </div>

  <div id="loading-screen" class="loading-container">
    <div class="spinner"></div>
    <h2>Building Reference Graph</h2>
    <p>Please wait while we fetch and process the references...</p>
    <div class="progress-container">
      <div class="progress-bar">
        <div id="progress" class="progress"></div>
      </div>
      <div id="progress-text" class="progress-text">Initializing...</div>
    </div>
  </div>
  
  <script>
document.addEventListener("DOMContentLoaded", function() {
    const svg = d3.select("#reference-graph-svg"); // Use ID for clarity
  const width = +svg.attr("width"); // These are set in HTML, but good to have if dynamic
  const height = +svg.attr("height");
  const tooltip = d3.select("#tooltip");
  const search_id = document.getElementById("search-id").textContent;
  const loadingScreen = document.getElementById("loading-screen");
  const progressBar = document.getElementById("progress");
  const progressText = document.getElementById("progress-text");
  var graphData;

  // Cache to store fetched paper details and references
  const cache = {};
  document.getElementById('saveHistoryBtn').addEventListener('click', async function() {
    // Create a structured format that preserves all necessary information
    const dataToSave = {
        nodes: graphData.nodes.map(node => ({
            id: node.id,
            title: node.title,
            level: node.level
        })),
        links: graphData.links.map(link => ({
            source: typeof link.source === 'object' ? link.source.id : link.source,
            target: typeof link.target === 'object' ? link.target.id : link.target
        })),
        rootId: search_id
    };
    
    try {
        const response = await fetch('/save-history', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(dataToSave)
        });
        
        if (response.ok) {
            // Show success message
            const saveConfirmation = d3.select("body")
                .append("div")
                .attr("class", "save-confirmation")
                .text("Graph saved successfully!");

            setTimeout(() => {
                saveConfirmation
                    .transition()
                    .style("opacity", "0")
                    .duration(300)
                    .on("end", function() {
                        saveConfirmation.remove();
                    });
            }, 2000);
        } else {
            console.error('Failed to save graph data');
        }
    } catch (error) {
        console.error('Error saving graph data:', error);
    }
});
  const requestQueue = [];
  let isProcessingQueue = false;
  const requestDelay = 800; // 800 milli second between requests
  let totalRequests = 0;
  let completedRequests = 0;

  function updateProgress(message, percent) {
    progressBar.style.width = `${percent}%`;
    progressText.textContent = message;
  }
  
  // Function to process the request queue with rate limiting
  async function processQueue() {
    if (isProcessingQueue || requestQueue.length === 0) return;
    
    isProcessingQueue = true;
    const { url, callback } = requestQueue.shift();
    
    try {
      completedRequests++; 
      updateProgress(`Processing request ${completedRequests} of ${totalRequests}...`, (completedRequests / totalRequests) * 100);
      const response = await axios.get(url);
      callback(response);
    } catch (error) {
      callback({ error });
    }
    
    setTimeout(() => {
      isProcessingQueue = false;
      processQueue();
    }, requestDelay);
  }
  
  // Function to add request to queue
  function queueRequest(url) {
    return new Promise((resolve) => {
      totalRequests++; 
      requestQueue.push({
        url,
        callback: (response) => resolve(response)
      });
      
      if (!isProcessingQueue) {
        processQueue();
      }
    });
  }

  // Function to copy text to clipboard
  function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(
      function() {
        const copyConfirmation = d3.select("body")
          .append("div")
          .attr("class", "copy-confirmation")
          .text("Title copied to clipboard!");

        setTimeout(() => {
          copyConfirmation
            .transition()
            .style("opacity", "0")
            .duration(300)
            .on("end", function() {
              copyConfirmation.remove();
            });
        }, 2000);
      },
      function(err) {
        console.error('Could not copy text: ', err);
      }
    );
  }

  // Fetch paper details by paperId with caching
   async function fetchPaperDetails(paperId) {
    if (cache[paperId]) return cache[paperId];
    try {
      const response = await queueRequest(`https://api.semanticscholar.org/graph/v1/paper/${paperId}`);
      if (response.error) throw response.error;
      const data = response.data;
      if (!data.title) data.title = "";
      cache[paperId] = data;
      return data;
    } catch (error) {
      console.warn(`No data available for paper ID: ${paperId}`);
      cache[paperId] = { paperId, title: "" };
      return cache[paperId];
    }
  }

  // Recursive function to fetch reference data up to a given depth with caching
  async function fetchReferences(paperId, depth = 3, currentLevel = 0) {
    if (depth === 0) return null;
    if (cache[paperId]?.children) return cache[paperId];
    try {
      updateProgress(`Fetching references for level ${currentLevel + 1}...`, Math.min(90, (completedRequests / totalRequests) * 100));
      const response = await queueRequest(`https://api.semanticscholar.org/graph/v1/paper/${paperId}/references?limit=2`);
      if (response.error) throw response.error;
      
      const apiData = response.data;
      const node = { id: paperId, title: "", children: [], level: currentLevel };
      
      for (let i = 0; i < apiData.data.length; i++) {
        const item = apiData.data[i];
        const childPaperId = item.citedPaper.paperId;
        const childDetails = await fetchPaperDetails(childPaperId);
        const childNode = await fetchReferences(childPaperId, depth - 1, currentLevel + 1);
        
        if (childDetails.title || (childNode && childNode.children.length > 0)) {
          node.children.push({
            id: childPaperId,
            title: childDetails.title || "",
            children: childNode ? childNode.children : [],
            level: currentLevel + 1
          });
        }
      }
      
      cache[paperId] = node;
      return node;
    } catch (error) {
      console.warn(`No references available for paper ID: ${paperId}`);
      cache[paperId] = { id: paperId, title: "", children: [], level: currentLevel };
      return cache[paperId];
    }
  }

  // Function to flatten the tree structure into nodes and links
  function buildGraph(root) {
    const nodes = [];
    const links = [];

    function traverse(node, parentId = null) {
      if (!node.title && node.children.length === 0) return;
      nodes.push({ 
        id: node.id, 
        title: node.title, 
        level: node.level || 0 
      });
      if (parentId !== null) {
        links.push({ source: parentId, target: node.id });
      }
      node.children.forEach(child => traverse(child, node.id));
    }
    traverse(root);
    return { nodes, links };
  }

  // Main function to initialize the graph and output JSON data
  async function initGraph() {
    const rootPaperId = search_id;
    const depth = 5;
    svg.selectAll("*").remove();
    
    loadingScreen.style.display = "flex";
    updateProgress("Fetching root paper details...", 5);

    const rootPaperDetails = await fetchPaperDetails(rootPaperId);
    const root = {
      id: rootPaperId,
      title: rootPaperDetails.title || "Untitled Paper",
      children: [],
      level: 0
    };

    updateProgress("Building reference tree...", 15);
    const referenceTree = await fetchReferences(rootPaperId, depth);
    if (referenceTree) root.children = referenceTree.children;

    updateProgress("Constructing graph data...", 95);
    graphData = buildGraph(root);
    console.log(JSON.stringify(graphData, null, 2));

    updateProgress("Rendering graph...", 98);
    const simulation = d3.forceSimulation(graphData.nodes)
      .force("link", d3.forceLink(graphData.links).id(d => d.id).distance(150))
      .force("charge", d3.forceManyBody().strength(-300))
      .force("center", d3.forceCenter(width / 2, height / 2));

    const zoom = d3.zoom()
      .scaleExtent([0.1, 4])
      .on("zoom", (event) => {
        svg.selectAll("g").attr("transform", event.transform);
      });

    svg.call(zoom);
    
    const container = svg.append("g");

    const link = container.append("g")
      .attr("class", "links")
      .selectAll("line")
      .data(graphData.links)
      .enter().append("line")
      .attr("class", "link");

    const node = container.append("g")
      .attr("class", "nodes")
      .selectAll("circle")
      .data(graphData.nodes)
      .enter().append("circle")
      .attr("class", d => {
        let classes = "node";
        if (d.id === rootPaperId) {
          classes += " root-node";
        } else {
          classes += ` node-level-${d.level}`;
        }
        return classes;
      })
      .attr("r", d => d.id === rootPaperId ? 12 : 8)
      .style("cursor", "pointer")
      .on("mouseover", function(event, d) {
        d3.select(this)
          .transition()
          .duration(200)
          .attr("r", d.id === rootPaperId ? 16 : 12);
          
        tooltip.html(`<strong>${d.title}</strong><br><span style="font-size: 12px; opacity: 0.8;">(Click to copy title)</span>`)
          .style("left", (event.pageX + 10) + "px")
          .style("top", (event.pageY - 28) + "px")
          .style("opacity", 1);
          
        link.style("stroke-opacity", l => 
          (l.source.id === d.id || l.target.id === d.id) ? 1 : 0.2
        );
        link.style("stroke-width", l => 
          (l.source.id === d.id || l.target.id === d.id) ? 3 : 1
        );
        node.style("opacity", n => 
          (n.id === d.id || graphData.links.some(l => 
            (l.source.id === d.id && l.target.id === n.id) || 
            (l.target.id === d.id && l.source.id === n.id)
          )) ? 1 : 0.5
        );
        
        text.style("opacity", t => 
          (t.id === d.id || graphData.links.some(l => 
            (l.source.id === d.id && l.target.id === t.id) || 
            (l.target.id === d.id && l.source.id === t.id)
          )) ? 1 : 0.2
        );
      })
      .on("mouseout", function() {
        d3.select(this)
          .transition()
          .duration(200)
          .attr("r", d => d.id === rootPaperId ? 12 : 8);
          
        tooltip.style("opacity", 0);
        
        link.style("stroke-opacity", 0.6);
        link.style("stroke-width", 1.5);
        node.style("opacity", 1);
        text.style("opacity", 1);
      })
      .on("click", function(event, d) {
        if (d.title && d.title.trim() !== "") {
          copyToClipboard(d.title);
          
          d3.select(this)
            .transition()
            .duration(100)
            .attr("r", d.id === rootPaperId ? 18 : 14)
            .transition()
            .duration(200)
            .attr("r", d.id === rootPaperId ? 12 : 8);
        }
      })
      .call(drag(simulation));

    const text = container.append("g")
      .attr("class", "labels")
      .selectAll("text")
      .data(graphData.nodes)
      .enter().append("text")
      .attr("class", "label")
      .attr("dx", 12)
      .attr("dy", ".35em")
      .style("cursor", "pointer")
      .text(d => d.title.length > 25 ? d.title.substring(0, 25) + "..." : d.title)
      .on("click", function(event, d) {
        if (d.title && d.title.trim() !== "") {
          copyToClipboard(d.title);
          
          d3.select(this)
            .style("font-weight", "bold")
            .transition()
            .duration(500)
            .style("font-weight", "normal");
        }
      });

    simulation.on("tick", () => {
      link.attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);
      node.attr("cx", d => d.x)
          .attr("cy", d => d.y);
      text.attr("x", d => d.x)
          .attr("y", d => d.y);
    });
    updateProgress("Complete!", 100);
    setTimeout(() => {
      loadingScreen.style.display = "none";
    }, 500);
  }

  function drag(simulation) {
    function dragstarted(event, d) {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    }
    function dragged(event, d) {
      d.fx = event.x;
      d.fy = event.y;
    }
    function dragended(event, d) {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null;
      d.fy = null;
    }
    return d3.drag()
      .on("start", dragstarted)
      .on("drag", dragged)
      .on("end", dragended);
  }

  initGraph();
});
  </script>
</body>
</html>
