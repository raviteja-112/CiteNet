<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reference Graph</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {"50":"#eff6ff","100":"#dbeafe","200":"#bfdbfe","300":"#93c5fd","400":"#60a5fa","500":"#3b82f6","600":"#2563eb","700":"#1d4ed8","800":"#1e40af","900":"#1e3a8a","950":"#172554"}
          }
        }
      }
    }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900">
  <div class="container p-6 mx-auto">
    <a href="{% url 'search' %}" class="text-2xl font-bold text-gray-900 dark:text-white hover:text-primary-500">Go back to Home</a>
    
    <button class="fixed px-4 py-2 text-white rounded-lg top-4 right-4 bg-primary-600 hover:bg-primary-700" id="saveHistoryBtn">Save History</button>
    
    <div hidden id="search-id">{{search_id}}</div>

    <div class="flex flex-wrap items-center gap-4 my-6">
      <div class="flex items-center gap-2">
        <label for="depthInput" class="text-sm font-medium text-gray-700 dark:text-gray-300">Max Depth:</label>
        <select id="depthInput" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500">
          <option value="1">1 Level</option>
          <option value="2" selected>2 Levels</option>
          <option value="3">3 Levels</option>
          <option value="4">4 Levels</option>
          <option value="5">5 Levels</option>
        </select>
      </div>
      <div class="flex items-center gap-2">
        <label for="maxRefsInput" class="text-sm font-medium text-gray-700 dark:text-gray-300">Max Refs per Paper:</label>
        <input type="number" id="maxRefsInput" value="3" min="2" max="15" step="1" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500">
      </div>
      <button id="regenerateBtn" class="px-4 py-2 text-white rounded-lg bg-primary-600 hover:bg-primary-700">Regenerate Graph</button>
      <button id="resetBtn" class="px-4 py-2 text-white bg-gray-600 rounded-lg hover:bg-gray-700">Reset View</button>
    </div>

    <div class="p-4 my-4 text-sm text-gray-700 bg-gray-100 rounded-lg dark:bg-gray-800 dark:text-gray-300" id="statsContainer">
      <div>Graph will be generated up to <span id="currentDepth" class="font-bold">2</span> levels deep</div>
      <div>Current stats: <span id="nodeCount" class="font-bold">0</span> nodes, <span id="linkCount" class="font-bold">0</span> links</div>
    </div>

    <div id="tooltip" class="absolute z-10 px-3 py-2 text-sm font-light text-white transition-opacity duration-300 bg-gray-900 rounded-lg shadow-sm opacity-0 tooltip dark:bg-gray-700"></div>
    <svg id="reference-graph-svg" class="w-full h-auto bg-white rounded-lg shadow-md dark:bg-gray-800"></svg>
  </div>

  <div id="loading-screen" class="fixed top-0 left-0 z-50 flex flex-col items-center justify-center w-full h-full bg-gray-900 bg-opacity-50 backdrop-blur-sm">
    <div class="w-16 h-16 border-4 border-t-4 rounded-full border-primary-500 border-t-transparent animate-spin"></div>
    <h2 class="mt-4 text-xl font-semibold text-white">Building Reference Graph</h2>
    <p class="text-white">Processing depth level: <span id="currentLevelSpan">1</span></p>
    <div class="w-64 mt-4 bg-gray-200 rounded-full h-2.5 dark:bg-gray-700">
        <div id="progress" class="bg-primary-600 h-2.5 rounded-full" style="width: 0%"></div>
    </div>
    <div id="progress-text" class="mt-2 text-sm text-white">Initializing...</div>
  </div>
  
  <script>
    // The rest of your script remains the same
    const cache = {};
    let graphData = { nodes: [], links: [] };
    let completedRequests = 0;
    let totalRequests = 0;
    let currentSimulation = null;
    let maxDepth = 2;
    let maxReferencesPerPaper = 3;
    
    // Get DOM elements
    const svg = d3.select("#reference-graph-svg");
    const tooltip = d3.select("#tooltip");
    const loadingScreen = document.getElementById("loading-screen");
    const progressBar = document.getElementById("progress");
    const progressText = document.getElementById("progress-text");
    const currentLevelSpan = document.getElementById("currentLevelSpan");
    const searchIdElement = document.getElementById("search-id");
    const depthInput = document.getElementById("depthInput");
    const maxRefsInput = document.getElementById("maxRefsInput");
    const regenerateBtn = document.getElementById("regenerateBtn");
    const resetBtn = document.getElementById("resetBtn");
    const statsContainer = document.getElementById("statsContainer");
    const currentDepthSpan = document.getElementById("currentDepth");
    const nodeCountSpan = document.getElementById("nodeCount");
    const linkCountSpan = document.getElementById("linkCount");
    
    const search_id = searchIdElement.textContent.replace(/"/g, '').replace(/{{search_id}}/g, '649def34f8be52c8b66281af98ae884c09aef38b');
    
    // Set SVG dimensions
    const width = 1200;
    const height = 800;
    svg.attr("viewBox", `0 0 ${width} ${height}`);
    
    // The rest of your script remains the same
    // ...
  </script>
</body>
</html>
