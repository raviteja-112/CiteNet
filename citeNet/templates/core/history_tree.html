<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reference Graph</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {"50":"#eff6ff","100":"#dbeafe","200":"#bfdbfe","300":"#93c5fd","400":"#60a5fa","500":"#3b82f6","600":"#2563eb","700":"#1d4ed8","800":"#1e40af","900":"#1e3a8a","950":"#172554"}
          }
        }
      }
    }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900">
  <div class="container p-6 mx-auto">
    <a href="{% url 'search' %}" class="text-2xl font-bold text-gray-900 dark:text-white hover:text-primary-500">Go back to Home</a>
    <div hidden id="pk">{{pk}}</div>
    <div id="tooltip" class="absolute z-10 px-3 py-2 text-sm font-light text-white transition-opacity duration-300 bg-gray-900 rounded-lg shadow-sm opacity-0 tooltip dark:bg-gray-700"></div>
    <svg width="1200" height="800" class="w-full h-auto bg-white rounded-lg shadow-md dark:bg-gray-800"></svg>
  </div>


  <div id="loading-screen" class="fixed top-0 left-0 z-50 flex flex-col items-center justify-center w-full h-full bg-gray-900 bg-opacity-50 backdrop-blur-sm">
    <div class="w-16 h-16 border-4 border-t-4 rounded-full border-primary-500 border-t-transparent animate-spin"></div>
    <h2 class="mt-4 text-xl font-semibold text-white">Loading Reference Graph</h2>
    <p class="text-white">Please wait while we load your graph data...</p>
  </div>
  
  <script>
  document.addEventListener("DOMContentLoaded", function() {
    const svg = d3.select("svg");
    const width = +svg.attr("width");
    const height = +svg.attr("height");
    const tooltip = d3.select("#tooltip");
    const loadingScreen = document.getElementById("loading-screen");
    const pk = parseInt(document.getElementById("pk").textContent, 10);

    
    // Show loading screen initially
    loadingScreen.style.display = "flex";
    
    // Function to copy text to clipboard
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(
        function() {
          // Show confirmation
          const copyConfirmation = d3.select("body")
            .append("div")
            .attr("class", "fixed top-5 left-1/2 -translate-x-1/2 bg-green-500 text-white px-4 py-2 rounded-md shadow-lg opacity-0")
            .text("Title copied to clipboard!");

          copyConfirmation
            .transition()
            .style("opacity", "1")
            .duration(300)
            .transition()
            .delay(2000)
            .style("opacity", "0")
            .duration(300)
            .remove();
        },
        function(err) {
          console.error('Could not copy text: ', err);
        }
      );
    }

    // Get graph data from backend
    fetch(`/history/specific_tree/${pk}/`) // Ensure the URL matches your backend endpoint
    .then(response => {
      if (!response.ok) {
        throw new Error(`Network response was not ok: ${response.status}`);
      }
      return response.json();
    })
    .then(data => {
      // Validate the structure of the data
      if (!data || !Array.isArray(data.nodes) || !Array.isArray(data.links)) {
        throw new Error('Invalid graph data received from the server.');
      }
      // Render the graph with the fetched data
      renderGraph(data);
    })
    .catch(error => {
      console.error('Error fetching graph data:', error);
      loadingScreen.style.display = "none";
      alert('Error loading graph data. Please try again later.');
    });

    function renderGraph(data) {
      svg.selectAll("*").remove();
      
      // Find the root node (level 0)
      const rootNodeId = data.rootId || data.nodes.find(node => node.level === 0)?.id;
      
      // Create simulation
      const simulation = d3.forceSimulation(data.nodes)
        .force("link", d3.forceLink(data.links).id(d => d.id).distance(150))
        .force("charge", d3.forceManyBody().strength(-300))
        .force("center", d3.forceCenter(width / 2, height / 2));

      // Create zoom behavior
      const zoom = d3.zoom()
        .scaleExtent([0.1, 4])
        .on("zoom", (event) => {
          container.attr("transform", event.transform);
        });

      // Apply zoom to SVG
      svg.call(zoom);
      
      // Create container group for zoom
      const container = svg.append("g");

      const link = container.append("g")
        .selectAll("line")
        .data(data.links)
        .join("line")
        .attr("class", "link stroke-gray-300 dark:stroke-gray-600");

      const node = container.append("g")
        .selectAll("circle")
        .data(data.nodes)
        .join("circle")
        .attr("r", d => (d.level === 0 || d.id === rootNodeId) ? 12 : 8)
        .attr("class", d => {
          let classes = "node stroke-2 stroke-white dark:stroke-gray-900 cursor-pointer";
          if (d.level === 0 || d.id === rootNodeId) {
            classes += " fill-red-500";
          } else {
            const colors = ["fill-blue-500", "fill-green-500", "fill-yellow-500", "fill-purple-500", "fill-teal-500"];
            classes += ` ${colors[d.level % colors.length]}`;
          }
          return classes;
        })
        .on("mouseover", function(event, d) {
          d3.select(this).transition().duration(200).attr("r", (d.level === 0 || d.id === rootNodeId) ? 16 : 12);
          tooltip.html(`<strong>${d.title}</strong><br><span class="text-xs opacity-80">(Click to copy title)</span>`)
            .style("left", (event.pageX + 10) + "px")
            .style("top", (event.pageY - 28) + "px")
            .style("opacity", 1);
          link.style("stroke-opacity", l => (l.source.id === d.id || l.target.id === d.id) ? 1 : 0.2);
          node.style("opacity", n => (n.id === d.id || data.links.some(l => (l.source.id === d.id && l.target.id === n.id) || (l.target.id === d.id && l.source.id === n.id))) ? 1 : 0.5);
          text.style("opacity", t => (t.id === d.id || data.links.some(l => (l.source.id === d.id && l.target.id === t.id) || (l.target.id === d.id && l.source.id === t.id))) ? 1 : 0.2);
        })
        .on("mouseout", function(event, d) {
          d3.select(this).transition().duration(200).attr("r", (d.level === 0 || d.id === rootNodeId) ? 12 : 8);
          tooltip.style("opacity", 0);
          link.style("stroke-opacity", 0.6);
          node.style("opacity", 1);
          text.style("opacity", 1);
        })
        .on("click", function(event, d) {
          if (d.title && d.title.trim() !== "") {
            copyToClipboard(d.title);
            d3.select(this).transition().duration(100).attr("r", (d.level === 0 || d.id === rootNodeId) ? 18 : 14).transition().duration(200).attr("r", (d.level === 0 || d.id === rootNodeId) ? 12 : 8);
          }
        })
        .call(drag(simulation));

      const text = container.append("g")
        .selectAll("text")
        .data(data.nodes)
        .join("text")
        .attr("class", "label text-xs fill-gray-600 dark:fill-gray-300 pointer-events-none select-none")
        .attr("dx", 12)
        .attr("dy", ".35em")
        .text(d => d.title.length > 25 ? d.title.substring(0, 25) + "..." : d.title);

      simulation.on("tick", () => {
        link.attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);
        node.attr("cx", d => d.x)
            .attr("cy", d => d.y);
        text.attr("x", d => d.x)
            .attr("y", d => d.y);
      });
      
      loadingScreen.style.display = "none";
    }

    function drag(simulation) {
      function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
      }
      
      function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
      }
      
      function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
      }
      
      return d3.drag()
        .on("start", dragstarted)
        .on("drag", dragged)
        .on("end", dragended);
    }
  });
  </script>
</body>
</html>
