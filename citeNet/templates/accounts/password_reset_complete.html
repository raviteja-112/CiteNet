{% extends 'layout.html' %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-screen">
  <div class="w-full max-w-md p-8 space-y-8 text-center bg-white rounded-lg shadow-lg dark:bg-gray-800">
    <div class="p-4 text-sm text-green-700 bg-green-100 rounded-lg dark:bg-green-200 dark:text-green-800" role="alert">
        <h2 class="text-2xl font-bold text-gray-900 dark:text-white">
          Password Reset Complete
        </h2>
        <p class="mt-2">Your password has been set. You may go ahead and log in now.</p>
    </div>
    <a href="{% url 'login' %}" class="inline-block px-4 py-2 text-sm font-medium text-white border border-transparent rounded-md group bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
      Log in
    </a>
  </div>
</div>
{% endblock %}
