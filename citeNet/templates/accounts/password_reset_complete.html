{% extends 'layout.html' %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<main class="flex items-center justify-center min-h-screen">
  <div class="w-full max-w-md p-8 space-y-8 bg-white rounded-lg shadow-lg dark:bg-gray-800">
    <h2 class="text-2xl font-bold text-center text-gray-900 dark:text-white">
      Password Reset Complete
    </h2>
    <div class="p-4 text-sm text-green-800 rounded-lg bg-green-50 dark:bg-gray-800 dark:text-green-400" role="alert">
        <span class="font-medium">Success!</span> Your password has been set. You may go ahead and log in now.
    </div>
    <a href="{% url 'login' %}" class="relative flex justify-center w-full px-4 py-2 text-sm font-medium text-white border border-transparent rounded-md group bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
      Log in
    </a>
  </div>
</main>
{% endblock %}
